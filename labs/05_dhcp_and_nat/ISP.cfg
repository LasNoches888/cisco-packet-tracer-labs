hostname ISP
no ip domain-lookup
!
interface GigabitEthernet0/0
 description link to customer R1
 ip address 203.0.113.1 255.255.255.252
 no shutdown
!
! Имитация внешнего узла в интернете
interface Loopback0
 ip address 8.8.8.8 255.255.255.255
!
! Намеренно нет маршрута в 192.168.10.0/24: без NAT ответы не вернутся.
!
end
